name: Publish qualified SDK components

on:
  workflow_run:
    workflows: [Build SDK Docker Image]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: sdk-production-components
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN }}
          role-session-name: sdk-components-${{ github.run_id }}
          allowed-account-ids: '069171140053'
      - name: Publish only the current reviewed main merge
        env:
          GH_TOKEN: ${{ github.token }}
          SSE_KMS_KEY_ID: ${{ vars.VULCAN_ARTIFACT_KMS_KEY_ID }}
        run: python scripts/publish-components.py
