name: Test daily platform image mirror
on:
  pull_request:
    paths:
      - scripts/sync-daily-platform-images.py
      - scripts/sync-swupdate-certificate.py
      - tests/sdk/test-swupdate-certificate.py
      - scripts/mirror_aws.py
      - tests/sdk/test-mirror-aws.py
      - scripts/notify-mirror-versions.py
      - scripts/post-debian-mirror-summary.py
      - tests/sdk/test-mirror-version-notifications.py
      - tests/sdk/test-daily-platform-images.py
      - .github/workflows/sync-debian-pre-release-mirror.yml
      - .github/workflows/test-daily-platform-images.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install 'boto3==1.43.91' 'moto[s3]==5.2.3' 'pytest==9.1.1' 'PyYAML==6.0.3'
      - run: python -m pytest -q tests/sdk/test-swupdate-certificate.py tests/sdk/test-daily-platform-images.py tests/sdk/test-mirror-version-notifications.py tests/sdk/test-mirror-aws.py
