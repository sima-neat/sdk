name: Daily pre-release mirror summary

on:
  schedule:
    # 8:10am Pacific during daylight saving time. GitHub cron is UTC.
    - cron: "10 15 * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: Retained mirror history to summarize (1-72 hours)
        required: true
        default: "24"
        type: string
      as_of:
        description: Optional UTC timestamp for deterministic replay (for example 2026-08-11T00:00:00Z)
        required: false
        type: string
      post_to_slack:
        description: Post the generated report to Slack
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-pre-release-mirror-summary
  cancel-in-progress: false

jobs:
  summarize:
    name: Generate agent summary for the previous 24 hours
    runs-on: [self-hosted, Linux, X64, issue-triage]
    timeout-minutes: 45
    env:
      WINDOW_HOURS: ${{ inputs.window_hours || '24' }}
      AS_OF: ${{ inputs.as_of || '' }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      SIMA_CLI_CHECK_FOR_UPDATE: "0"

    steps:
      - name: Check out SDK
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure runner tool paths
        run: |
          set -euo pipefail
          for path in \
            "$HOME/.local/bin" \
            "$HOME/bin" \
            "$HOME/.npm-global/bin" \
            "$HOME/.cargo/bin" \
            "/usr/local/bin" \
            "/snap/bin" \
            "/home/linuxbrew/.linuxbrew/bin"
          do
            if [[ -d "$path" ]]; then
              echo "$path" >> "$GITHUB_PATH"
            fi
          done

      - name: Verify agent summary tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 --version
          gh --version
          gh auth status

      - name: Collect mirror-sync workflow results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arguments=(
            --repository "${GITHUB_REPOSITORY}"
            --workflow sync-debian-pre-release-mirror.yml
            --window-hours "${WINDOW_HOURS}"
            --output out/debian-mirror-summary-context.json
          )
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            arguments+=(--schedule "${EVENT_SCHEDULE}")
          elif [[ -n "${AS_OF}" ]]; then
            arguments+=(--as-of "${AS_OF}")
          fi
          python3 scripts/collect-debian-mirror-summary.py "${arguments[@]}"

      - name: Generate deterministic mirror digest
        run: |
          set -euo pipefail
          python3 scripts/generate-debian-mirror-summary.py \
            --context out/debian-mirror-summary-context.json \
            --output out/debian-mirror-summary.md \
            --max-characters 3000

      - name: Post mirror digest to Slack
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.post_to_slack == true)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_MIRROR_NOTIFICATION_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python3 scripts/post-debian-mirror-summary.py \
            --report out/debian-mirror-summary.md

      - name: Preview mirror digest
        if: github.event_name == 'workflow_dispatch' && inputs.post_to_slack != true
        run: |
          set -euo pipefail
          python3 scripts/post-debian-mirror-summary.py \
            --report out/debian-mirror-summary.md \
            --dry-run

      - name: Write job summary
        if: always()
        run: |
          if [[ -f out/debian-mirror-summary.md ]]; then
            {
              echo '## Daily pre-release mirror digest'
              echo
              cat out/debian-mirror-summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mirror summary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-pre-release-mirror-summary
          path: |
            out/debian-mirror-summary-context.json
            out/debian-mirror-summary.md
          if-no-files-found: ignore
          retention-days: 3
