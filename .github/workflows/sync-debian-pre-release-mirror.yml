name: Sync pre-release Debian mirror
# Platform 3.0: internal deb/daily, suite agate, ARM64.

on:
  schedule:
    # Run away from the top and half-hour to reduce Actions queue delays.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated mirror to production S3
        required: true
        default: false
        type: boolean
      force:
        description: Run even when the published InRelease digest is unchanged
        required: true
        default: false
        type: boolean
      minimum_free_gib:
        description: Minimum persistent disk space required before synchronization
        required: true
        default: "100"
        type: string
      download_workers:
        description: Maximum concurrent apt-mirror2 downloads
        required: true
        default: "16"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: debian-pre-release-mirror-production
  cancel-in-progress: false

jobs:
  sync:
    name: Validate and optionally publish Agate 3.0 mirror
    environment: production
    runs-on: [self-hosted, Linux, X64, apt-mirror]
    timeout-minutes: 720
    env:
      AWS_REGION: ${{ vars.VULCAN_DEBIAN_MIRROR_AWS_REGION || 'us-west-2' }}
      DEBIAN_MIRROR_WORK_ROOT: ${{ vars.DEBIAN_MIRROR_WORK_ROOT || '/var/lib/sima-neat/debian-mirror' }}
      VULCAN_DEBIAN_MIRROR_BUCKET: ${{ vars.VULCAN_DEBIAN_MIRROR_BUCKET || 'sima-neat-debian-production' }}
      VULCAN_DEBIAN_MIRROR_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.VULCAN_DEBIAN_MIRROR_CLOUDFRONT_DISTRIBUTION_ID || 'E64NIJ10VID5O' }}
      VULCAN_DEBIAN_MIRROR_KMS_KEY_ID: ${{ vars.VULCAN_DEBIAN_MIRROR_KMS_KEY_ID || 'arn:aws:kms:us-west-2:069171140053:key/4bf76f64-6ff3-4447-8572-b4f92163d497' }}
      VULCAN_DEBIAN_MIRROR_PUBLISHER_ROLE_ARN: ${{ vars.VULCAN_DEBIAN_MIRROR_PUBLISHER_ROLE_ARN || 'arn:aws:iam::069171140053:role/NeatProductionDebianMirrorPublisher' }}

    steps:
      - name: Check out SDK
        uses: actions/checkout@v5

      - name: Install mirror dependencies
        id: mirror_dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            awscli \
            ca-certificates \
            curl \
            gnupg \
            jq \
            python3 \
            python3-boto3 \
            util-linux
          scripts/install-apt-mirror2.sh

      - name: Prepare persistent mirror workspace
        id: mirror_workspace
        run: |
          set -euo pipefail
          sudo install -d \
            -o "$(id -u)" \
            -g "$(id -g)" \
            -m 0750 \
            "${DEBIAN_MIRROR_WORK_ROOT}"

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.VULCAN_DEBIAN_MIRROR_PUBLISHER_ROLE_ARN }}
          role-session-name: sdk-debian-mirror-${{ github.run_id }}

      - name: Synchronize and validate mirror
        env:
          APT_MIRROR2_THREADS: ${{ inputs.download_workers || '16' }}
          DEBIAN_MIRROR_REPORT_DIR: ${{ github.workspace }}/out/debian-mirror-sync
          MINIMUM_FREE_GIB: ${{ inputs.minimum_free_gib || '100' }}
        run: |
          set -euo pipefail
          arguments=(--minimum-free-gib "${MINIMUM_FREE_GIB}")
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            arguments+=(--publish)
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            arguments+=(--force)
          fi
          scripts/sync-debian-pre-release-mirror.sh "${arguments[@]}"

      - name: Upload machine-readable synchronization result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-pre-release-mirror-result-${{ github.run_id }}
          path: out/debian-mirror-sync/mirror-sync-result.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Refresh production AWS credentials for daily platform images
        id: daily_credentials
        if: ${{ !cancelled() && steps.mirror_dependencies.outcome == 'success' && steps.mirror_workspace.outcome == 'success' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.VULCAN_DEBIAN_MIRROR_PUBLISHER_ROLE_ARN }}
          role-session-name: sdk-daily-images-${{ github.run_id }}

      - name: Mirror daily platform images and retain the latest 7 builds
        if: ${{ !cancelled() && steps.daily_credentials.outcome == 'success' }}
        run: |
          set -euo pipefail
          arguments=(--work-root "${DEBIAN_MIRROR_WORK_ROOT}" --report "out/daily-platform-images/result.json")
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            arguments+=(--publish)
          fi
          python3 scripts/sync-daily-platform-images.py "${arguments[@]}"

      - name: Notify Slack of new APT and device image versions
        if: ${{ always() && steps.mirror_workspace.outcome == 'success' && (github.event_name == 'schedule' || inputs.publish == true) }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_VULCAN_EVENT_CHANNEL_ID: ${{ vars.SLACK_VULCAN_EVENT_CHANNEL_ID }}
        run: |
          python3 scripts/notify-mirror-versions.py \
            --apt-report out/debian-mirror-sync/mirror-sync-result.json \
            --image-report out/daily-platform-images/result.json \
            --state "${DEBIAN_MIRROR_WORK_ROOT}/version-notifications/state.json"
