.muted {fill:#bfc4cd} .blue {fill:#8ab6e8} .green {fill:#83c59b} .purple {fill:#d1cee6}
.eyebrow {font-size:16px;font-weight:600;letter-spacing:1.6px} .title {font-size:36px;font-weight:600;letter-spacing:-.6px} .h {font-size:24px;font-weight:600} .name {font-size:20px;font-weight:600} .body {font-size:16px} .small {font-size:12px;font-weight:600;letter-spacing:1px}
.flow {stroke:#bfc4cd;stroke-width:2;fill:none;marker-end:url(#arrow)}
.control {stroke:#bfc4cd;stroke-width:1.2;stroke-dasharray:4 4;fill:none;marker-end:url(#arrow)}
</style>
