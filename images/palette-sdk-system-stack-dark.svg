<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="948" viewBox="0 0 1280 948" role="img" aria-labelledby="palette-stack-title palette-stack-desc">
<title id="palette-stack-title">Palette SDK system stack</title>
<desc id="palette-stack-desc">On the developer computer, sima-cli installs and configures the Palette SDK environment and the separate Palette Image Builder companion. The SDK environment includes application development tools and a Model Compiler extension installed during SDK setup. Application source and models become custom Debian packages containing applications and model assets. PIB combines these with image specifications, overlays, hooks and signing keys to produce signed SWU updates and full disk images for an ARM64 Modalix DevKit.</desc>
